<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <bb-liquid-lines
      bg-colors="#100000, #100000"
      bg-angle="0"
      line-count="12"
      line-amplitude="50"
      line-frequency="0.006"
      speed="0.15"
      line-spacing="60"
      line-width="12"
      line-hue-start="0"
      line-hue-end="30"
      line-saturation="100"
      line-offset-step="0.2"
      wiggle-amplitude="10"
      wiggle-speed="0.1"
      trail-opacity="0.1"
    ></bb-liquid-lines>
  </div>
  <script type="module">
    import { BbLiquidLines } from "https://esm.sh/beautiful-backgrounds";

    // Cycle wave colors only — leave amplitude, spacing, speed, etc. alone.
    // Red → blue → green → red; continuously lerp to the next color over each 15s phase.
    const lines = document.querySelector("bb-liquid-lines");
    const pageBg = document.querySelector(".page-bg");
    const PHASE_MS = 15_000;
    const colors = [
      { hueStart: 0, hueEnd: 30, bg: [0x10, 0x00, 0x00] },   // red / orange
      { hueStart: 210, hueEnd: 250, bg: [0x00, 0x00, 0x10] }, // blue
      { hueStart: 110, hueEnd: 150, bg: [0x00, 0x10, 0x00] }, // green
    ];

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function rgbToHex(r, g, b) {
      const toHex = (n) => Math.round(n).toString(16).padStart(2, "0");
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function applyColor(c) {
      const bg = rgbToHex(c.bg[0], c.bg[1], c.bg[2]);
      lines.setAttribute("line-hue-start", String(Math.round(c.hueStart)));
      lines.setAttribute("line-hue-end", String(Math.round(c.hueEnd)));
      lines.setAttribute("bg-colors", `${bg}, ${bg}`);
      if (pageBg) pageBg.style.background = bg;
    }

    let phaseIndex = 0;
    let phaseStarted = performance.now();

    function tick(now) {
      let elapsed = now - phaseStarted;
      while (elapsed >= PHASE_MS) {
        phaseIndex = (phaseIndex + 1) % colors.length;
        phaseStarted += PHASE_MS;
        elapsed = now - phaseStarted;
      }

      const from = colors[phaseIndex];
      const to = colors[(phaseIndex + 1) % colors.length];
      const t = elapsed / PHASE_MS;

      applyColor({
        hueStart: lerp(from.hueStart, to.hueStart, t),
        hueEnd: lerp(from.hueEnd, to.hueEnd, t),
        bg: [
          lerp(from.bg[0], to.bg[0], t),
          lerp(from.bg[1], to.bg[1], t),
          lerp(from.bg[2], to.bg[2], t),
        ],
      });

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav">
        <a href="#projects">Projects</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}. Built with <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a>.</p>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" class="footer-github">
        github.com/{{ site.github_username }}
      </a>
    </div>
  </footer>
</body>
</html>
