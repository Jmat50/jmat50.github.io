<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <bb-liquid-lines
      bg-colors="#100000, #100000"
      bg-angle="0"
      line-count="12"
      line-amplitude="50"
      line-frequency="0.006"
      speed="0.15"
      line-spacing="60"
      line-width="12"
      line-hue-start="0"
      line-hue-end="30"
      line-saturation="100"
      line-offset-step="0.2"
      wiggle-amplitude="10"
      wiggle-speed="0.1"
      trail-opacity="0.1"
    ></bb-liquid-lines>
  </div>
  <script type="module">
    import { BbLiquidLines } from "https://esm.sh/beautiful-backgrounds";

    // Cycle wave colors only — leave amplitude, spacing, speed, etc. alone.
    // Red → blue → green → red; 15s per color, smooth handoff between phases.
    const lines = document.querySelector("bb-liquid-lines");
    const pageBg = document.querySelector(".page-bg");
    const PHASE_MS = 15_000;
    const TRANSITION_MS = 2_500;
    const colors = [
      { hueStart: 0, hueEnd: 30, bg: "#100000" },   // red / orange
      { hueStart: 210, hueEnd: 250, bg: "#000010" }, // blue
      { hueStart: 110, hueEnd: 150, bg: "#001000" }, // green
    ];

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function applyColor(c) {
      lines.setAttribute("line-hue-start", String(Math.round(c.hueStart)));
      lines.setAttribute("line-hue-end", String(Math.round(c.hueEnd)));
      lines.setAttribute("bg-colors", `${c.bg}, ${c.bg}`);
      if (pageBg) pageBg.style.background = c.bg;
    }

    applyColor(colors[0]);

    let phaseIndex = 0;
    let phaseStarted = performance.now();

    function tick(now) {
      const elapsed = now - phaseStarted;
      const nextIndex = (phaseIndex + 1) % colors.length;
      const from = colors[phaseIndex];
      const to = colors[nextIndex];

      if (elapsed >= PHASE_MS - TRANSITION_MS && elapsed < PHASE_MS) {
        const t = easeInOut((elapsed - (PHASE_MS - TRANSITION_MS)) / TRANSITION_MS);
        applyColor({
          hueStart: lerp(from.hueStart, to.hueStart, t),
          hueEnd: lerp(from.hueEnd, to.hueEnd, t),
          bg: t < 0.5 ? from.bg : to.bg,
        });
      } else if (elapsed >= PHASE_MS) {
        phaseIndex = nextIndex;
        phaseStarted = now;
        applyColor(colors[phaseIndex]);
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav">
        <a href="#projects">Projects</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}. Built with <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a>.</p>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" class="footer-github">
        github.com/{{ site.github_username }}
      </a>
    </div>
  </footer>
</body>
</html>
